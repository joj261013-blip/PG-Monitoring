# 나라장터 API 연결 테스트 (수동 실행 전용)
#
# - 실행 방법: GitHub 저장소 → Actions 탭 → "나라장터 API 연결 테스트" → Run workflow
# - 자동 스케줄(schedule)은 아직 설정하지 않았습니다.
# - 보안
#   * 저장소 읽기 권한만 사용합니다. (permissions: contents: read)
#   * 외부 Action은 변경될 수 없도록 커밋 SHA로 고정했습니다.
#   * 인증키를 쓰는 단계에서는 외부 패키지를 설치하지 않습니다. (Python 표준 라이브러리만 사용)
#   * 인증키는 그 단계의 환경변수로만 전달하며, 프로그램은 키를 출력하지 않습니다.
name: 나라장터 API 연결 테스트

on:
  workflow_dispatch:
    inputs:
      days:
        description: "조회 기간 (최근 며칠, 1~30)"
        required: false
        default: "7"
      rows:
        description: "API별 조회 건수 (1~20)"
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: api-connection-test
  cancel-in-progress: false

jobs:
  api-check:
    name: API 연결 확인
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12 설치
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: API 연결 테스트 실행
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          CHECK_DAYS: ${{ inputs.days }}
          CHECK_ROWS: ${{ inputs.rows }}
          PYTHONPATH: src
        run: python -m pg_monitoring.api_check
