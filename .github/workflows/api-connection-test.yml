# 나라장터 API 연결 테스트 + 공개용 샘플 페이지 (수동 실행 전용)
#
# 실행: GitHub 저장소 → Actions 탭 → "나라장터 API 연결 테스트" → Run workflow
#   - "GitHub Pages에 배포" 체크 안 함(기본): 테스트 + 샘플 파일 생성만 (다운로드로 미리보기)
#   - 체크함: 테스트 성공 시 GitHub Pages(공개 웹페이지)에 샘플 페이지 배포
# 자동 스케줄(schedule)은 아직 설정하지 않았습니다.
#
# 보안
#   * 기본 권한 없음. 작업별로 꼭 필요한 권한만 부여합니다.
#   * 외부 Action은 GitHub 공식 Action만 쓰고, 바뀔 수 없도록 커밋 SHA로 고정했습니다.
#   * 인증키는 "API 연결 테스트 실행" 단계의 환경변수로만 전달되며, 그 단계는 외부 패키지를
#     설치하지 않고 저장소의 Python 코드(표준 라이브러리만 사용)만 실행합니다.
#   * 배포 작업(deploy)에는 인증키가 전달되지 않습니다.
name: 나라장터 API 연결 테스트

on:
  workflow_dispatch:
    inputs:
      days:
        description: "조회 기간 (최근 며칠, 1~6. 입찰공고는 7일 이상이면 오류)"
        required: false
        default: "3"
      rows:
        description: "API별 조회 건수 (1~20)"
        required: false
        default: "5"
      deploy:
        description: "테스트 성공 시 GitHub Pages에 샘플 페이지 배포 (공개됨)"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: api-connection-test
  cancel-in-progress: false

jobs:
  api-check:
    name: API 연결 확인 및 샘플 생성
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12 설치
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: API 연결 테스트 실행
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          CHECK_DAYS: ${{ inputs.days }}
          CHECK_ROWS: ${{ inputs.rows }}
          SITE_DIR: site
          PYTHONPATH: src
        run: python -m pg_monitoring.api_check

      - name: 샘플 파일 보관 (미리보기용 다운로드)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nara-sample-site
          path: site/
          retention-days: 7
          if-no-files-found: error

      - name: GitHub Pages 배포용 묶음 만들기
        if: ${{ inputs.deploy }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: GitHub Pages 배포
    needs: api-check
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
