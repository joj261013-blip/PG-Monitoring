# ============================================================
# PG 관련성 판정 키워드
# GitHub 웹에서 이 파일을 열고 연필(✏️) 아이콘으로 수정할 수 있습니다.
#
# 작성 규칙
# - 따옴표 안에 단어를 쓰고 쉼표로 구분합니다.  예) "통합수납", "수납대행"
# - 띄어쓰기는 무시하고 비교합니다. ("수수료 납부" = "수수료납부")
# - 영문은 대소문자를 구분하지 않고, 단어 단위로만 일치합니다.
#   ("PG"는 "PG 서비스", "PG사"에는 걸리지만 "UPGRADE" 속의 PG에는 걸리지 않음)
#
# 판정 기준
# - 직접 관련: [direct] 단어가 하나라도 있거나,
#              [collection]·[payment_method]·[settlement] 중 2개 이상 분류의 단어가 함께 있음
# - 검토 필요: 위 분류나 [extended]·[broad] 단어가 1개 이상 있음
# - 낮음    : 해당 단어 없음 (삭제하지 않고 이력에는 보관)
# ============================================================

[categories.direct]
label = "직접 관련"
words = ["PG", "전자지급결제대행", "지급결제대행", "결제대행", "전자결제", "온라인결제", "결제서비스", "결제시스템", "결제 솔루션"]

[categories.collection]
label = "수납"
words = ["통합수납", "수납대행", "수납시스템", "납부시스템", "요금수납", "수수료 납부", "등록금 수납", "전자수납", "수납서비스"]

[categories.payment_method]
label = "결제수단"
words = ["신용카드", "카드결제", "간편결제", "계좌이체", "가상계좌", "QR결제", "모바일결제", "카드 단말기", "결제단말"]

[categories.settlement]
label = "정산"
words = ["정산대행", "결제정산", "매출정산", "대사시스템"]

[categories.extended]
label = "확장 후보"
words = ["응시료", "시험 수수료", "민원 수수료", "회비", "공공요금", "온라인 예약", "티켓 예매", "예매시스템", "예약시스템", "발급수수료"]

# 키워드와 정확히 같지 않아도 후보로 남기기 위한 넓은 단어 (검토 필요로만 분류)
[categories.broad]
label = "광범위 후보"
words = ["결제", "수납", "납부", "정산", "예매", "키오스크", "등기", "학점은행", "독학학위"]

# 오탐 제외용 단어. 여기 적은 단어는 판정 전에 지운 뒤 키워드를 찾습니다.
# 예) "등기"가 '등기우편'에서 자꾸 걸린다면 words = ["등기우편"] 처럼 추가
[exclude]
words = []

# 판정에 사용할 API 항목 (항목명: 화면에 표시할 이름)
[fields.bid]
bidNtceNm = "공고명"
purchsObjPrdctList = "구매대상물품"
pubPrcrmntClsfcNm = "공공조달분류"
pubPrcrmntMidClsfcNm = "공공조달 중분류"
pubPrcrmntLrgClsfcNm = "공공조달 대분류"
srvceDivNm = "용역구분"
ntceInsttNm = "공고기관"
dminsttNm = "수요기관"

[fields.prespec]
prdctClsfcNoNm = "품명(사업명)"
prdctDtlList = "세부품명"
bsnsDivNm = "업무구분"
orderInsttNm = "발주기관"
rlDminsttNm = "실수요기관"
